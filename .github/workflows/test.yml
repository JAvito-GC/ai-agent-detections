name: test-detections

on:
  push:
    paths:
      - "rules/**"
      - "fixtures/**"
      - "tests/**"
      - "requirements.txt"
      - "pipelines/**"
      - "convert.sh"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Exercise every rule against its fixtures
        run: PYTHONPATH=tests pytest -q
      - name: Validate rules with sigma-cli and regenerate SIEM queries
        run: |
          pip install pySigma==1.5.1 pySigma-backend-elasticsearch==2.1.1 pySigma-backend-kusto==1.0.1 pysigma-backend-splunk==2.1.0 sigma-cli==3.1.0
          sigma check rules/
          ./convert.sh
          git diff --exit-code conversions/ || (echo "conversions/ is stale: run ./convert.sh and commit" && exit 1)
