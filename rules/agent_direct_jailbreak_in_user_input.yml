title: Direct Jailbreak Attempt in User Input
id: a3f1e5c2-7b94-4d16-9a2e-5c8d1f0b3a67
status: experimental
x_fixtures: direct_jailbreak
x_owasp_llm:
  - LLM01   # Prompt Injection
description: >
  Detects a direct (first-order) prompt-injection / jailbreak attempt arriving in
  content the agent treats as the USER turn. The attacker instructs the model to
  drop its guardrails — "ignore previous instructions", "developer mode", DAN-style
  role-play, "pretend you have no restrictions", "bypass your guidelines". Unlike
  indirect injection (which arrives via tool/retrieval output), this comes straight
  from the operator-facing input channel, so source=user is part of the signal.
references:
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://atlas.mitre.org/techniques/AML.T0051/   # LLM Prompt Injection
  - https://atlas.mitre.org/techniques/AML.T0054/   # LLM Jailbreak
author: Javier Morales
date: 2026/10/20
logsource:
  product: ai_agent
  category: agent_runtime
detection:
  selection:
    event_type: user_prompt
    content.source: user
    content|contains:
      - ignore previous instructions
      - developer mode
      - pretend you have no restrictions
      - bypass your guidelines
  dan:
    event_type: user_prompt
    content.source: user
    content|re: '\bDAN\b'
  condition: selection or dan
fields:
  - session_id
  - agent
  - content.source
  - content
falsepositives:
  - Users quoting or asking about jailbreak phrases legitimately (e.g. a security researcher testing the system) — gate by user role or allow a documented test session.
  - The DAN token is matched with a word boundary (\bDAN\b) to avoid firing on words like abundant or mundane; a user literally named Dan writing their name could still match, so gate by role if noisy.
level: high
