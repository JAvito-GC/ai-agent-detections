title: AI Agent Leaked a Secret in Model Output
id: 0e62aa41-8d17-435e-9243-28f6a4f52305
status: experimental
x_fixtures: secrets_in_output
x_owasp_llm:
  - LLM02   # Sensitive Information Disclosure
description: >
  Detects a credential pattern (API key / access token) appearing in the text
  the model emits — a model_completion whose content matches a known secret
  shape. An agent that echoes a secret into its own output has already disclosed
  it: the token lands in logs, downstream tools, chat transcripts, or the next
  prompt. This is a direct sensitive-information-disclosure signal, independent
  of how the secret got into context (poisoned retrieval, over-broad tool scope,
  or the model surfacing an env var).
references:
  - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
  - https://atlas.mitre.org/techniques/AML.T0057/   # LLM Data Leakage
author: Javier Morales
date: 2026/10/20
tags:
  - attack.credential-access
logsource:
  product: ai_agent
  category: agent_runtime
detection:
  selection:
    event_type: model_completion
    content|re: '(sk-[-A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})'
  condition: selection
fields:
  - session_id
  - agent
  - content
falsepositives:
  - Documentation or examples that use clearly fake placeholder keys of the right length — scope out known docs sessions, or redact before logging.
  - A test fixture or key-rotation runbook that prints a revoked key on purpose.
level: high
